<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Magnetometer Enclosure</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a full-height 3D viewer with a parts rail on the right; on phones the rail drops under the viewer */
:root {
  --bg: #E5E9EB;
  --panel: #F4F6F7;
  --ink: #1A2227;
  --muted: #56636B;
  --line: #C6CFD4;
  --scene: #DCE2E5;
  --copper: #A4552A;
  --teal: #2B7488;
  --chip-ink-bg: #1A2227;
  --chip-ink-fg: #F4F6F7;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1416; --panel: #161D21; --ink: #E0E6E9; --muted: #92A0A7; --line: #2A353B;
    --scene: #131A1E; --copper: #D9874F; --teal: #6CB6CA; --chip-ink-bg: #E0E6E9; --chip-ink-fg: #0F1416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1416; --panel: #161D21; --ink: #E0E6E9; --muted: #92A0A7; --line: #2A353B;
  --scene: #131A1E; --copper: #D9874F; --teal: #6CB6CA; --chip-ink-bg: #E0E6E9; --chip-ink-fg: #0F1416;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
.titles { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.sub { margin: 6px 0 0; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.tabs button {
  font: 500 13px/1 var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 4px;
  padding: 8px 12px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.tabs button:hover:not([aria-selected="true"]) { color: var(--ink); }
button:focus-visible, input:focus-visible, li:focus-visible, .lbl .txt:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
.viewer { position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--scene); overflow: hidden; }
#c { display: block; width: 100%; height: 100%; touch-action: none; }

.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.lbl .dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--copper); box-shadow: 0 0 0 2px var(--scene); }
.lbl .txt {
  position: absolute; left: 9px; top: -11px; white-space: nowrap; pointer-events: auto; cursor: pointer;
  font: 500 12px/1.2 var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  padding: 4px 7px; border-radius: 3px;
}
.lbl.left .txt { left: auto; right: 9px; }
.lbl .txt:hover, .lbl.hot .txt { border-color: var(--copper); }

.tip {
  position: absolute; pointer-events: none; max-width: 240px; z-index: 3;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 8px; font-size: 12px; line-height: 1.35; box-shadow: 0 4px 14px rgb(0 0 0 / 0.12);
}
.tip b { display: block; font-weight: 600; }
.tip span { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }

.hint { position: absolute; top: 10px; left: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); pointer-events: none; }
.controls {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  pointer-events: none;
}
.ctl {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 5px;
  font-size: 12px; color: var(--ink); cursor: pointer;
}
.ctl input[type="range"] { width: 120px; accent-color: var(--copper); }
.ctl input[type="checkbox"] { accent-color: var(--copper); margin: 0; }
.ctl.btn { font: 500 12px/1.2 var(--font-body); }
.ctl.is-off { opacity: 0.45; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: var(--scene); }

.rail { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.rail > * { flex-shrink: 0; }
.note { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 10px 12px; font-size: 13px; }
.note p { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-block; font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; white-space: nowrap; }
.chip.proj { background: var(--chip-ink-bg); color: var(--chip-ink-fg); border: 1px solid var(--chip-ink-bg); }
.chip.prop { color: var(--copper); border: 1px dashed var(--copper); }
.chip.tbd { color: var(--muted); border: 1px dashed var(--muted); }
.rail h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; margin: 0; }
.lede { margin: -6px 0 0; color: var(--ink); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stats div { background: var(--panel); padding: 8px 10px; min-width: 0; }
.stats dt { font: 500 10.5px/1.2 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 3px 0 0; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.eyebrow { margin: 4px 0 -6px; font: 500 10.5px/1.2 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.parts li { padding: 10px 4px 10px 10px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; cursor: pointer; }
.parts li:hover, .parts li.hot { border-left-color: var(--copper); background: color-mix(in srgb, var(--panel) 70%, transparent); }
.ph { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; justify-content: space-between; }
.pn { font-weight: 600; }
.parts p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.goto { display: flex; flex-wrap: wrap; gap: 8px; }
.goto button { font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.goto button:hover { border-color: var(--copper); }
.foot { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 0; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .viewer { height: min(72vh, 600px); min-height: 360px; }
  .rail { overflow: visible; padding-right: 0; }
}
@media (max-width: 520px) {
  h1 { font-size: 26px; }
  .ctl input[type="range"] { width: 90px; }
  .hint { display: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="titles">
      <h1>Magnetometer Enclosure</h1>
      <p class="sub">Concept · rev E boards · rev C coil · 23 Oct 2026</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="View">

  <main class="main">

      <div class="loading" id="loading">Loading the 3D model…</div>
    </section>
    <aside class="rail" id="rail" aria-live="polite"></aside>
  </main>
</div>

/* -------------------------------------------------------------- materials */
function std(color, o = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: o.r ?? 0.6, metalness: o.m ?? 0, map: o.map ?? null,
    transparent: !!o.t, opacity: o.op ?? 1, depthWrite: !o.t, side: o.side ?? THREE.FrontSide,
    emissive: o.em ?? 0x000000, emissiveIntensity: o.emi ?? 1,
  });
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
const loader = new THREE.TextureLoader();
function imgTex(src) {
  const t = loader.load(src);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;

/* --------------------------------------------------------------- helpers */
const partMeshes = {};
function tag(o, key) {
  o.traverse((c) => {
    if (!c.isMesh) return;
    c.userData.part = key;
    c.material = Array.isArray(c.material) ? c.material.map((m) => m.clone()) : c.material.clone();
    (partMeshes[key] ||= []).push(c);
  });
  return o;
}
function mesh(geo, mat, key, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  if (key) tag(m, key);
  return m;
}
// box with its bottom face at y
function addBox(p, w, h, d, x, y, z, mat, key) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), mat, key, p);
  m.position.set(x, y + h / 2, z);
  return m;
}
// vertical cylinder with its bottom at y
function addCyl(p, r, h, x, y, z, mat, key, seg = 32) {
  const m = mesh(new THREE.CylinderGeometry(r, r, h, seg), mat, key, p);
  m.position.set(x, y + h / 2, z);
  return m;
}
// cylinder along an axis ('x' or 'z'), centred at (x, y, z)
function axisCyl(p, r, len, axis, x, y, z, mat, key, seg = 32, r2) {
  const g = new THREE.CylinderGeometry(r2 ?? r, r, len, seg);
  if (axis === 'x') g.rotateZ(-Math.PI / 2);
  if (axis === 'z') g.rotateX(Math.PI / 2);
  const m = mesh(g, mat, key, p);
  m.position.set(x, y, z);
  return m;
}
function curveOf(pts) { return new THREE.CatmullRomCurve3(pts.map((q) => new THREE.Vector3(...q)), false, 'catmullrom', 0.35); }
function wire(p, pts, r, mat, key, seg = 64) {
  return mesh(new THREE.TubeGeometry(curveOf(pts), seg, r, 10, false), mat, key, p);
}
function twisted(p, pts, rr, turns, r, matA, matB, key) {
  const c = curveOf(pts);
  const N = 240;
  const f = c.computeFrenetFrames(N, false);
  const a = [], b = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, th = 2 * Math.PI * turns * t;
    const q = c.getPointAt(t);
    const off = f.normals[i].clone().multiplyScalar(Math.cos(th) * rr).add(f.binormals[i].clone().multiplyScalar(Math.sin(th) * rr));
    a.push(q.clone().add(off)); b.push(q.clone().sub(off));
  }
  mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(a), N, r, 8, false), matA, key, p);
  mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(b), N, r, 8, false), matB, key, p);
}
function pinRow(p, xs, z0, pitch, n, y0, len, key) {
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(0.64, len, 0.64), M.gold, xs.length * n);
  const mx = new THREE.Matrix4();
  let k = 0;
  for (const x of xs) for (let i = 0; i < n; i++) { mx.makeTranslation(x, y0 + len / 2, z0 + i * pitch); im.setMatrixAt(k++, mx); }
  im.castShadow = true;
  p.add(im);
  tag(im, key);
  return im;
}
function lathe(profile, mat, key, p, seg = 72) {
  const g = new THREE.LatheGeometry(profile.map(([r, t]) => new THREE.Vector2(r, t)), seg);
  return mesh(g, mat, key, p);
}

/* -------------------------------------------------------------- PCB parts */
// Board-local frame: x = KiCad x, z = KiCad y (down), y up from the board's underside; components sit on y = 1.6.
function makeBoard(w, d, src, key) {
  const g = new THREE.Group();
  const top = new THREE.MeshStandardMaterial({ map: imgTex(src), roughness: 0.5, metalness: 0.05 });
  const m = mesh(new THREE.BoxGeometry(w, 1.6, d), [M.pcbEdge, M.pcbEdge, top, M.pcbBottom, M.pcbEdge, M.pcbEdge], key, g);
  m.position.set(w / 2, 0.8, d / 2);
  return g;
}
// Phoenix MKDS 1,5 horizontal terminal block; 'L' = on the left edge (wires enter from -x), 'R' = right edge.
function terminal(g, n, x0, y0, side, key) {
  const H = 10, D = 10.1, L = (n - 1) * 5.08 + 5.5, s = side === 'L' ? 1 : -1;
  const ymin = side === 'L' ? y0 - 2.8 : y0 - (n - 1) * 5.08 - 2.7;
  const cx = x0 + 0.3 * s;
  addBox(g, D, H, L, cx, 1.6, ymin + L / 2, M.terminal, key);
  for (let i = 0; i < n; i++) {
    const py = y0 + s * i * 5.08;
    addCyl(g, 1.75, 0.5, x0 - 0.2 * s, 1.6 + H, py, M.screw, key, 20);
    addBox(g, 3.2, 0.2, 0.5, x0 - 0.2 * s, 1.6 + H + 0.45, py, M.dark, key);
    addBox(g, 0.5, 3.4, 3.8, cx - s * (D / 2 + 0.2), 1.6 + 2.0, py, M.dark, key);
  }
}
function ecap(g, dia, h, x, z, key) {
  addCyl(g, dia / 2, h - 0.3, x, 1.6, z, M.can, key, 28);
  addCyl(g, dia / 2 * 0.97, 0.3, x, 1.6 + h - 0.3, z, M.canTop, key, 28);
}
function socket2(g, xa, xb, za, zb, y, h, key, mat = M.socket) {
  const x0 = Math.min(xa, xb) - 1.27, x1 = Math.max(xa, xb) + 1.27, z0 = Math.min(za, zb) - 1.27, z1 = Math.max(za, zb) + 1.27;
  return addBox(g, x1 - x0, h, z1 - z0, (x0 + x1) / 2, y, (z0 + z1) / 2, mat, key);
}
const HOLES80 = [[4, 4], [76, 4], [4, 56], [76, 56]];
function standoffs(g, holes, len, key = 'standoffs') {
  for (const [x, z] of holes) {
    const m = mesh(new THREE.CylinderGeometry(3.18, 3.18, len, 6), M.nylon, key, g);
    m.position.set(x, -len / 2, z);
  }
}

function visibleChain(o) { for (let c = o; c; c = c.parent) if (!c.visible) return false; return true; }

function applyXray() {
  scene.traverse((o) => {
    if (!o.isMesh || !o.userData.xray) return;
    for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
      m.transparent = state.xray;
      m.opacity = state.xray ? (o.userData.xrayOp ?? 0.15) : 1;
      m.depthWrite = !state.xray;
      m.needsUpdate = true;
    }
    o.castShadow = !state.xray;
  });
}

function applyExplode() {
  const e = state.view === 'system' ? 0 : state.explode;
  polG.position.y = LV.pol + 30 * e;
  afeG.position.y = LV.afe + 60 * e;
  acqG.position.y = LV.acq + 90 * e;
  nucG.position.y = LV.nuc + 125 * e;
  lidG.position.y = 190 * e;
  wiresG.visible = e < 0.01;
  pipeG.position.y = 230 * e;
  capPG.position.x = 130 * e;
  capNG.position.x = -130 * e;
  headStub.visible = e < 0.01 && state.view === 'head';
  headInner.visible = e < 0.01;
}

function applyView() {
  const v = state.view;
  boxG.visible = v !== 'head';
  headG.visible = v !== 'box';
  sysG.visible = v === 'system';
  if (v === 'system') { headG.position.set(-520, 122, 0); boxG.position.set(420, 3, 0); }
  else { headG.position.set(0, 122, 0); boxG.position.set(0, 3, 0); }
  boxStub.visible = v === 'box';
  annotG.visible = v === 'head' && state.labels;
  document.getElementById('explodeCtl').classList.toggle('is-off', v === 'system');
  document.getElementById('explode').disabled = v === 'system';
  applyExplode();
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', String(b.dataset.view === v));
  renderRail();
}

    li.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flyToPart(li.dataset.key); } });
  }
  for (const b of rail.querySelectorAll('[data-goto]')) b.addEventListener('click', () => setView(b.dataset.goto));
}

/* -------------------------------------------------------- highlight / fly */
let hotKey = null;
const accentColor = new THREE.Color();
function setHot(key) {
  if (key === hotKey) return;
  for (const m of partMeshes[hotKey] || []) for (const mat of Array.isArray(m.material) ? m.material : [m.material]) { mat.emissive.setHex(mat.userData.em0 ?? 0); mat.emissiveIntensity = mat.userData.emi0 ?? 1; }
  hotKey = key;
  for (const m of partMeshes[key] || []) for (const mat of Array.isArray(m.material) ? m.material : [m.material]) {
    if (mat.userData.em0 === undefined) { mat.userData.em0 = mat.emissive.getHex(); mat.userData.emi0 = mat.emissiveIntensity; }
    mat.emissive.copy(accentColor); mat.emissiveIntensity = 0.55;
  }
  for (const li of rail.querySelectorAll('li[data-key]')) li.classList.toggle('hot', li.dataset.key === key);
  for (const L of LABELS) L.el.classList.toggle('hot', L.k === key);
}
function visibleBox(objs) {
  const b = new THREE.Box3();
  for (const o of objs) {
    o.updateWorldMatrix(true, true);
    o.traverse((c) => { if (c.isMesh && !c.userData.noFit && visibleChain(c)) b.expandByObject(c); });
  }
  return b;
}
let anim = null;
function moveCamera(pos, target, instant) {
  if (instant || reduceMotion) { camera.position.copy(pos); controls.target.copy(target); controls.update(); anim = null; return; }
  anim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), dur: 700 };
}
function fitObjects(objs, dirArr, pad = 1.08, instant = false) {
  const b = visibleBox(objs);
  if (b.isEmpty()) return;
  const c = b.getCenter(new THREE.Vector3());
  const r = b.getSize(new THREE.Vector3()).length() / 2;
  const vf = camera.fov * Math.PI / 180;
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const dist = (r / Math.sin(Math.min(vf, hf) / 2)) * pad;
  const dir = new THREE.Vector3(...dirArr).normalize();
  moveCamera(c.clone().add(dir.multiplyScalar(dist)), c, instant);
}
function fitView(instant = false) {
  const objs = state.view === 'box' ? [boxG] : state.view === 'head' ? [headG] : [headG, boxG, sysG];
  fitObjects(objs, VIEWS[state.view].dir, state.view === 'system' ? 0.74 : 0.98, instant);
}
function flyToPart(key) {
  const ms = (partMeshes[key] || []).filter((m) => visibleChain(m));
  if (!ms.length) return;
  const b = new THREE.Box3();
  ms.forEach((m) => b.expandByObject(m));
  const c = b.getCenter(new THREE.Vector3());
  const r = Math.max(b.getSize(new THREE.Vector3()).length() / 2, 40);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const vf = camera.fov * Math.PI / 180;
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  moveCamera(c.clone().add(dir.multiplyScalar(r / Math.sin(Math.min(vf, hf) / 2) * 1.25)), c, false);
  setHot(key);
}

/* ------------------------------------------------------------------ theme */
function applyTheme() {
  const cs = getComputedStyle(document.documentElement);
  const sceneCol = cs.getPropertyValue('--scene').trim() || '#DCE2E5';
  scene.background = new THREE.Color(sceneCol);
  accentColor.set(cs.getPropertyValue('--copper').trim() || '#A4552A');
  const dark = new THREE.Color(sceneCol).getHSL({}).l < 0.4;
  if (grid) { scene.remove(grid); grid.geometry.dispose(); }
  grid = new THREE.GridHelper(4000, 80, dark ? 0x2c383e : 0xb7c1c6, dark ? 0x1d262b : 0xcbd3d7);
  grid.position.y = 0.05;
  scene.add(grid);
  ground.material.opacity = dark ? 0.32 : 0.14;
  if (hotKey) { const k = hotKey; hotKey = null; setHot(k); }
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* --------------------------------------------------------------- picking */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
let pointer = null, pointerDirty = false;
canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  pointer = { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height, type: e.pointerType };
  pointerDirty = true;
});
canvas.addEventListener('pointerleave', () => { pointer = null; tip.hidden = true; setHot(null); });
function pick() {
  pointerDirty = false;
  if (!pointer || pointer.type === 'touch') { tip.hidden = true; return; }
  ndc.set((pointer.x / pointer.w) * 2 - 1, -(pointer.y / pointer.h) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const roots = [boxG, headG, sysG].filter((g) => g.visible);
  const hits = ray.intersectObjects(roots, true);
  let key = null;
  for (const h of hits) {
    const o = h.object;
    if (!visibleChain(o) || !o.userData.part) continue;
    if (state.xray && o.userData.xray) continue;
    if (o === lid) continue;
    key = o.userData.part; break;
  }
  if (!key || !PARTS[key]) { tip.hidden = true; setHot(null); return; }
  setHot(key);
  const p = PARTS[key];
  tip.innerHTML = `<b>${p.name}</b><span>${CHIP[p.st][1]}</span>`;
  tip.hidden = false;
  const x = Math.min(pointer.x + 14, pointer.w - tip.offsetWidth - 8), y = Math.min(pointer.y + 14, pointer.h - tip.offsetHeight - 8);
  tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
}

/* -------------------------------------------------------------- controls */
function setView(v) {
  if (!VIEWS[v]) return;
  state.view = v;
  state.explode = 0;
  document.getElementById('explode').value = '0';
  setHot(null);
  applyView();
  fitView(false);
}
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => setView(b.dataset.view));
document.getElementById('explode').addEventListener('input', (e) => { state.explode = Number(e.target.value); applyExplode(); });
document.getElementById('xray').addEventListener('change', (e) => { state.xray = e.target.checked; applyXray(); });
const lblBox = document.getElementById('showLabels');
lblBox.checked = state.labels;
lblBox.addEventListener('change', (e) => { state.labels = e.target.checked; annotG.visible = state.view === 'head' && state.labels; });
document.getElementById('reset').addEventListener('click', () => fitView(false));

/* ----------------------------------------------------------- render loop */
function resize() {
  const w = viewer.clientWidth, h = viewer.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewer);

// Place labels each frame: flip a label to the other side when it would leave the viewer,
// and push it down when its text would overlap one already placed.
const placed = [], shown = [];
function updateLabels() {
  const w = viewer.clientWidth, h = viewer.clientHeight;
  placed.length = 0; shown.length = 0;
  for (const L of LABELS) {
    let show = state.labels && L.v === state.view && visibleChain(L.o);
    if (show && L.wires && !wiresG.visible) show = false;
    if (show) {
      tmpV.copy(L.vec).applyMatrix4(L.o.matrixWorld).project(camera);
      if (tmpV.z > 1 || tmpV.z < -1) show = false;
    }
    if (!show) { if (!L.el.hidden) L.el.hidden = true; continue; }
    L.sx = (tmpV.x * 0.5 + 0.5) * w;
    L.sy = (-tmpV.y * 0.5 + 0.5) * h;
    shown.push(L);
  }
  shown.sort((a, b) => a.sy - b.sy);
  for (const L of shown) {
    if (L.el.hidden) L.el.hidden = false;
    if (!L.tw) L.tw = L.txt.offsetWidth || 120;
    const th = 23;
    let left = L.s === 'left';
    if (!left && L.sx + 9 + L.tw > w - 6) left = true;
    else if (left && L.sx - 9 - L.tw < 6) left = false;
    const x0 = left ? L.sx - 9 - L.tw : L.sx + 9, x1 = x0 + L.tw;
    let y0 = L.sy - 11;
    for (let guard = 0; guard < 12; guard++) {
      const hit = placed.find((r) => x0 < r.x1 + 4 && x1 > r.x0 - 4 && y0 < r.y1 && y0 + th > r.y0);
      if (!hit) break;
      y0 = hit.y1 + 2;
    }
    placed.push({ x0, x1, y0, y1: y0 + th });
    L.el.classList.toggle('left', left);
    L.txt.style.transform = `translateY(${(y0 - (L.sy - 11)).toFixed(1)}px)`;
    L.el.style.transform = `translate(${L.sx.toFixed(1)}px, ${L.sy.toFixed(1)}px)`;
  }
}
if (document.fonts) document.fonts.ready.then(() => { for (const L of LABELS) L.tw = 0; });

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
let firstFrame = true;
function frame(now) {
  if (anim) {
    const t = Math.min(1, (now - anim.start) / anim.dur), k = ease(t);
    camera.position.lerpVectors(anim.p0, anim.p1, k);
    controls.target.lerpVectors(anim.t0, anim.t1, k);
    if (t >= 1) anim = null;
  }
  controls.update();
  if (pointerDirty) pick();
  renderer.render(scene, camera);
  updateLabels();
  if (firstFrame) { firstFrame = false; loading.hidden = true; }
  requestAnimationFrame(frame);
}

applyTheme();
applyXray();
const startView = (location.hash || '').replace('#', '');
state.view = VIEWS[startView] ? startView : 'box';
applyView();
resize();
fitView(true);
requestAnimationFrame(frame);
</script>

</body></html>
